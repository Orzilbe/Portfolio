<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Or Zilberberg | Portfolio</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SN2CH626FL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SN2CH626FL');
  </script>
  <style>
    @font-face {
      font-family: 'Blacker Sans Pro';
      src: url('assets/fonts/blacker_sans/Blacker-Sans-Extrabold-trial.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Blacker Sans Pro', sans-serif;
      background: #ffffff;
      padding: 20px;
      color: #111;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      flex: 1;
      width: 100%;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Main Card Layout */
    .card-body {
      background: linear-gradient(to bottom, #f7dfff, #ffffff);
      border-radius: 24px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      min-height: 380px;
      padding: 60px 44px 0 44px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      position: relative;
    }

    #particles-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .card-text, .card-image {
      position: relative;
      z-index: 1;
    }

    .card-text {
      flex: 1;
      padding-bottom: 60px;
    }

    .card-text h1 {
      font-size: 42px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .card-image {
      width: 320px;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .card-image img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .footer-nav {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px 0;
    }

    .footer-nav a {
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: opacity 0.2s ease;
    }

    .footer-nav a:hover {
      opacity: 0.6;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .card-body {
        flex-direction: column;
        padding: 40px 24px 0 24px;
        align-items: center;
        text-align: center;
      }
      .card-image { width: 100%; max-width: 280px; }
      .footer-nav { gap: 20px; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header class="top-bar">
      <div class="logo">Or Zilberberg</div>
      <div class="tagline">YOUR ONLY LIMIT IS YOUR MIND</div>
    </header>

    <main class="card-body" id="hero-card">
      <canvas id="particles-canvas"></canvas>
      <div class="card-text">
        <h1>Product & Implementation Manager</h1>
      </div>
      <div class="card-image">
        <img src="assets/images/orzil.png" alt="Or Zilberberg">
      </div>
    </main>

    <nav class="footer-nav"></nav>
  </div>

  <script src="assets/js/page-transition.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>
    (function() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      const card = document.getElementById('hero-card');

      let particles = [];
      let mouse = { x: -1000, y: -1000 };
      const PARTICLE_COUNT = 45;
      const CONNECT_DISTANCE = 100;
      const MOUSE_RADIUS = 150;

      function resize() {
        canvas.width = card.offsetWidth;
        canvas.height = card.offsetHeight;
      }

      function createParticle() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6,
          radius: Math.random() * 3 + 1.5,
          baseAlpha: Math.random() * 0.4 + 0.15
        };
      }

      function init() {
        resize();
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(createParticle());
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          // Mouse repulsion
          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < MOUSE_RADIUS) {
            const force = (MOUSE_RADIUS - dist) / MOUSE_RADIUS;
            p.vx += (dx / dist) * force * 0.8;
            p.vy += (dy / dist) * force * 0.8;
          }

          // Damping
          p.vx *= 0.98;
          p.vy *= 0.98;

          p.x += p.vx;
          p.y += p.vy;

          // Wrap around edges
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;

          // Draw particle
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(180, 80, 220, ${p.baseAlpha})`;
          ctx.fill();

          // Draw connections
          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const cdx = p.x - p2.x;
            const cdy = p.y - p2.y;
            const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
            if (cdist < CONNECT_DISTANCE) {
              const alpha = (1 - cdist / CONNECT_DISTANCE) * 0.15;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(180, 80, 220, ${alpha})`;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(animate);
      }

      card.addEventListener('mousemove', function(e) {
        const rect = card.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
      });

      card.addEventListener('mouseleave', function() {
        mouse.x = -1000;
        mouse.y = -1000;
      });

      window.addEventListener('resize', resize);

      init();
      animate();
    })();
  </script>
</body>
</html>
