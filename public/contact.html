<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Or Zilberberg</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SN2CH626FL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SN2CH626FL');
  </script>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/contact.css">
</head>
<body>

  <div class="wrapper">
    <header class="top-bar">
      <div class="logo">Or Zilberberg</div>
      <div class="tagline">YOUR ONLY LIMIT IS YOUR MIND</div>
    </header>

    <main class="card-contact">
      <div class="bubbles">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <h1>Let's Talk.</h1>

      <form class="contact-form" id="contactForm" action="https://formspree.io/f/xvzvyvgd" method="POST">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-send" id="submitBtn">Send Message</button>
      </form>
    </main>

    <nav class="footer-nav"></nav>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <h3>Message Sent! ✨</h3>
      <p>Thanks for reaching out. I'll get back to you soon.</p>
      <button class="btn-close" id="closeModal">Got it</button>
    </div>
  </div>

  <script src="../assets/js/page-transition.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/contact.js"></script>
</body>
</html>
