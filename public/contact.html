<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Or Zilberberg</title>
  <style>
    @font-face {
      font-family: 'Blacker Sans Pro';
      src: url('../assets/fonts/blacker_sans/Blacker-Sans-Extrabold-trial.ttf') format('truetype');
      font-weight: 800;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Blacker Sans Pro', sans-serif;
      background: #ffffff;
      padding: 20px;
      color: #111;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .wrapper {
      max-width: 860px;
      margin: 0 auto;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo { font-size: 15px; font-weight: 800; text-transform: uppercase; }

    .card-contact {
      background: linear-gradient(to bottom, #CFECF3, #ffffff);
      border-radius: 24px;
      padding: 60px 44px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      flex: 1;
      width: 100%;
    }

    /* החזרת הכותרת לשמאל */
    h1 { 
      font-size: 48px; 
      margin-bottom: 40px; 
      letter-spacing: -1px; 
      text-align: left; 
    }

    .contact-form { 
      display: flex; 
      flex-direction: column; 
      gap: 25px; 
      width: 100%; 
    }

    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #666; }
    
    .form-group input, .form-group textarea {
      padding: 16px;
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 12px;
      font-family: sans-serif;
      font-size: 16px;
      background: #ffffff;
      width: 100%;
      outline: none;
    }

    /* כפתור ממורכז */
    .btn-send {
      background: #111;
      color: #fff;
      padding: 18px 60px;
      border: none;
      border-radius: 50px;
      font-family: 'Blacker Sans Pro', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      display: block;
      margin: 20px auto 0 auto;
      width: fit-content;
    }

    .btn-send:hover { transform: scale(1.05); background: #333; }
    .btn-send:disabled { background: #ccc; cursor: not-allowed; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center; align-items: center; z-index: 1000;
    }

    .modal-content {
      background: white; padding: 50px; border-radius: 30px; text-align: center; max-width: 420px;
      transform: translateY(20px); opacity: 0; transition: all 0.4s ease;
    }

    .modal-overlay.active { display: flex; }
    .modal-overlay.active .modal-content { transform: translateY(0); opacity: 1; }

    .btn-close {
      background: #CFECF3; border: none; padding: 12px 25px; border-radius: 50px;
      font-weight: 800; cursor: pointer; text-transform: uppercase;
    }

    .footer-nav {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px 0;
    }

    .footer-nav a {
      color: #111 !important;
      text-decoration: none !important;
      font-family: 'Blacker Sans Pro', sans-serif !important;
      font-weight: 800 !important;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header class="top-bar">
      <div class="logo">Or Zilberberg</div>
    </header>

    <main class="card-contact">
      <h1>Let's Talk.</h1>
      
      <form class="contact-form" id="contactForm" action="https://formspree.io/f/xvzvyvgd" method="POST">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-send" id="submitBtn">Send Message</button>
      </form>
    </main>

    <nav class="footer-nav"></nav>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <h3>Message Sent! ✨</h3>
      <p>Thanks for reaching out. I'll get back to you soon.</p>
      <button class="btn-close" id="closeModal">Got it</button>
    </div>
  </div>

  <script src="../assets/js/nav.js"></script>

  <script>
    const form = document.getElementById('contactForm');
    const overlay = document.getElementById('modalOverlay');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      const data = new FormData(form);
      
      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          overlay.classList.add('active');
          form.reset();
        } else {
          alert('Error: Please check your Formspree ID.');
        }
      } catch (error) {
        alert('Network error. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
      }
    });

    document.getElementById('closeModal').addEventListener('click', () => {
      overlay.classList.remove('active');
    });
  </script>
</body>
</html>
